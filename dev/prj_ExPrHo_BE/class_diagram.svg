<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 620" width="100%" height="100%">
  <!-- Background -->
  <rect width="820" height="620" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="410" y="25" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Biểu đồ lớp (Class Diagram) của hệ thống</text>

  <!-- Definition of Marker for Association -->
  <defs>
    <marker id="diamond" viewBox="0 0 10 10" refX="5" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 5 0 L 10 5 L 5 10 L 0 5 Z" fill="#475569"/>
    </marker>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#475569"/>
    </marker>
  </defs>

  <!-- Row 1: Role, Permission, User, ActionLog -->
  <!-- Role -->
  <g transform="translate(40, 50)">
    <rect width="150" height="100" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="0" y1="28" x2="150" y2="28" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Role</text>
    <text x="10" y="45" font-family="Inter, sans-serif" font-size="9" fill="#334155">- id: Integer</text>
    <text x="10" y="60" font-family="Inter, sans-serif" font-size="9" fill="#334155">- roleName: String</text>
    <text x="10" y="75" font-family="Inter, sans-serif" font-size="9" fill="#334155">- description: String</text>
  </g>

  <!-- Permission -->
  <g transform="translate(230, 50)">
    <rect width="150" height="100" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="0" y1="28" x2="150" y2="28" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Permission</text>
    <text x="10" y="45" font-family="Inter, sans-serif" font-size="9" fill="#334155">- id: Integer</text>
    <text x="10" y="60" font-family="Inter, sans-serif" font-size="9" fill="#334155">- permissionName: String</text>
    <text x="10" y="75" font-family="Inter, sans-serif" font-size="9" fill="#334155">- code: String</text>
  </g>

  <!-- User -->
  <g transform="translate(420, 50)">
    <rect width="150" height="130" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="0" y1="28" x2="150" y2="28" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">User</text>
    <text x="10" y="42" font-family="Inter, sans-serif" font-size="9" fill="#334155">- id: Long</text>
    <text x="10" y="54" font-family="Inter, sans-serif" font-size="9" fill="#334155">- username: String</text>
    <text x="10" y="66" font-family="Inter, sans-serif" font-size="9" fill="#334155">- passwordHash: String</text>
    <text x="10" y="78" font-family="Inter, sans-serif" font-size="9" fill="#334155">- email: String</text>
    <text x="10" y="90" font-family="Inter, sans-serif" font-size="9" fill="#334155">- fullName: String</text>
    <text x="10" y="102" font-family="Inter, sans-serif" font-size="9" fill="#334155">- status: String</text>
  </g>

  <!-- ActionLog -->
  <g transform="translate(610, 50)">
    <rect width="150" height="100" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="0" y1="28" x2="150" y2="28" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">ActionLog</text>
    <text x="10" y="45" font-family="Inter, sans-serif" font-size="9" fill="#334155">- id: Long</text>
    <text x="10" y="60" font-family="Inter, sans-serif" font-size="9" fill="#334155">- action: String</text>
    <text x="10" y="75" font-family="Inter, sans-serif" font-size="9" fill="#334155">- ipAddress: String</text>
  </g>

  <!-- Row 2: Category, Product, StockLog -->
  <!-- Category -->
  <g transform="translate(40, 240)">
    <rect width="150" height="100" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="0" y1="28" x2="150" y2="28" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Category</text>
    <text x="10" y="45" font-family="Inter, sans-serif" font-size="9" fill="#334155">- id: Long</text>
    <text x="10" y="60" font-family="Inter, sans-serif" font-size="9" fill="#334155">- name: String</text>
    <text x="10" y="75" font-family="Inter, sans-serif" font-size="9" fill="#334155">- status: String</text>
  </g>

  <!-- Product -->
  <g transform="translate(230, 240)">
    <rect width="150" height="140" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="0" y1="28" x2="150" y2="28" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Product</text>
    <text x="10" y="42" font-family="Inter, sans-serif" font-size="9" fill="#334155">- id: Long</text>
    <text x="10" y="54" font-family="Inter, sans-serif" font-size="9" fill="#334155">- sku: String</text>
    <text x="10" y="66" font-family="Inter, sans-serif" font-size="9" fill="#334155">- name: String</text>
    <text x="10" y="78" font-family="Inter, sans-serif" font-size="9" fill="#334155">- price: BigDecimal</text>
    <text x="10" y="90" font-family="Inter, sans-serif" font-size="9" fill="#334155">- costPrice: BigDecimal</text>
    <text x="10" y="102" font-family="Inter, sans-serif" font-size="9" fill="#334155">- stockQuantity: int</text>
  </g>

  <!-- StockLog -->
  <g transform="translate(420, 240)">
    <rect width="150" height="110" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="0" y1="28" x2="150" y2="28" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">StockLog</text>
    <text x="10" y="45" font-family="Inter, sans-serif" font-size="9" fill="#334155">- id: Long</text>
    <text x="10" y="60" font-family="Inter, sans-serif" font-size="9" fill="#334155">- changeQuantity: int</text>
    <text x="10" y="75" font-family="Inter, sans-serif" font-size="9" fill="#334155">- type: String</text>
    <text x="10" y="90" font-family="Inter, sans-serif" font-size="9" fill="#334155">- reason: String</text>
  </g>

  <!-- Row 3: Customer, Order, OrderItem -->
  <!-- Customer -->
  <g transform="translate(40, 440)">
    <rect width="150" height="120" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="0" y1="28" x2="150" y2="28" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Customer</text>
    <text x="10" y="45" font-family="Inter, sans-serif" font-size="9" fill="#334155">- id: Long</text>
    <text x="10" y="60" font-family="Inter, sans-serif" font-size="9" fill="#334155">- customerCode: String</text>
    <text x="10" y="75" font-family="Inter, sans-serif" font-size="9" fill="#334155">- fullName: String</text>
    <text x="10" y="90" font-family="Inter, sans-serif" font-size="9" fill="#334155">- phone: String</text>
  </g>

  <!-- Order -->
  <g transform="translate(230, 440)">
    <rect width="150" height="120" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="0" y1="28" x2="150" y2="28" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Order</text>
    <text x="10" y="45" font-family="Inter, sans-serif" font-size="9" fill="#334155">- id: Long</text>
    <text x="10" y="60" font-family="Inter, sans-serif" font-size="9" fill="#334155">- orderCode: String</text>
    <text x="10" y="75" font-family="Inter, sans-serif" font-size="9" fill="#334155">- totalAmount: BigDecimal</text>
    <text x="10" y="90" font-family="Inter, sans-serif" font-size="9" fill="#334155">- status: String</text>
  </g>

  <!-- OrderItem -->
  <g transform="translate(420, 440)">
    <rect width="150" height="100" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
    <line x1="0" y1="28" x2="150" y2="28" stroke="#475569" stroke-width="1.5"/>
    <text x="75" y="19" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">OrderItem</text>
    <text x="10" y="45" font-family="Inter, sans-serif" font-size="9" fill="#334155">- id: Long</text>
    <text x="10" y="60" font-family="Inter, sans-serif" font-size="9" fill="#334155">- quantity: int</text>
    <text x="10" y="75" font-family="Inter, sans-serif" font-size="9" fill="#334155">- price: BigDecimal</text>
  </g>

  <!-- Relation Lines -->
  <!-- Role to User (Many to Many - represent with line) -->
  <line x1="190" y1="100" x2="230" y2="100" stroke="#475569" stroke-width="1.2"/>
  <line x1="380" y1="100" x2="420" y2="100" stroke="#475569" stroke-width="1.2"/>

  <!-- User to ActionLog (1 to Many) -->
  <line x1="570" y1="100" x2="610" y2="100" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Category to Product (1 to Many) -->
  <line x1="190" y1="290" x2="230" y2="290" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Product to StockLog (1 to Many) -->
  <line x1="380" y1="290" x2="420" y2="290" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Customer to Order (1 to Many) -->
  <line x1="190" y1="490" x2="230" y2="490" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>

  <!-- Order to OrderItem (1 to Many Composition - diamond) -->
  <line x1="380" y1="490" x2="420" y2="490" stroke="#475569" stroke-width="1.2" marker-start="url(#diamond)" marker-end="url(#arrow)"/>
</svg>
