  <line x1="95" y1="545" x2="290" y2="465" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="95" y1="545" x2="290" y2="575" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="95" y1="545" x2="290" y2="630" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Customer Relations -->
  <line x1="705" y1="355" x2="510" y2="80" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="705" y1="355" x2="510" y2="465" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="705" y1="355" x2="510" y2="520" stroke="#94a3b8" stroke-width="1.2"/>
