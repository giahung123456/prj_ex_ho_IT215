  <line x1="95" y1="165" x2="290" y2="135" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="95" y1="165" x2="290" y2="190" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="95" y1="165" x2="290" y2="245" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="95" y1="165" x2="290" y2="630" stroke="#94a3b8" stroke-width="1.2"/>

  <!-- Storekeeper Relations -->
  <line x1="95" y1="355" x2="290" y2="80" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="95" y1="355" x2="290" y2="300" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="95" y1="355" x2="290" y2="355" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="95" y1="355" x2="290" y2="410" stroke="#94a3b8" stroke-width="1.2"/>
  <line x1="95" y1="355" x2="290" y2="630" stroke="#94a3b8" stroke-width="1.2"/>

