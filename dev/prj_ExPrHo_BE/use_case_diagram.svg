  <text x="400" y="52" text-anchor="middle" font-family="Inter, sans-serif" font-size="12" font-weight="bold" fill="#475569">Hệ Thống Quản Lý Sản Phẩm &amp; Bán Hàng</text>

  <!-- Actors -->
  <!-- Admin -->
  <circle cx="80" cy="140" r="15" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="155" x2="80" y2="195" stroke="#475569" stroke-width="2"/>
  <line x1="60" y1="165" x2="100" y2="165" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="195" x2="65" y2="225" stroke="#475569" stroke-width="2"/>
