  <text x="80" y="245" text-anchor="middle" font-family="Inter, sans-serif" font-size="13" font-weight="bold" fill="#1e293b">Admin</text>

  <!-- Storekeeper -->
  <circle cx="80" cy="330" r="15" fill="#f1f5f9" stroke="#475569" stroke-width="2"/>
  <line x1="80" y1="345" x2="80" y2="385" stroke="#475569" stroke-width="2"/>
