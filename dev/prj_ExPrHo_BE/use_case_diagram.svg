  <ellipse cx="400" cy="410" rx="110" ry="18" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
  <text x="400" y="414" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" fill="#1e3a8a">UC09: Xem lịch sử kho</text>

