<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <!-- Background -->
  <rect width="800" height="450" fill="#f8fafc" rx="12"/>

  <!-- Title -->
  <text x="400" y="30" text-anchor="middle" font-family="Inter, sans-serif" font-size="14" font-weight="bold" fill="#1e293b">Sơ đồ tuần tự: Luồng xác thực đăng nhập cấp JWT Token</text>

  <!-- Lifelines (vertical lines) -->
  <!-- Người dùng -->
  <line x1="120" y1="80" x2="120" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4"/>
  <rect x="50" y="55" width="140" height="30" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
  <text x="120" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Người dùng</text>

  <!-- React Client -->
  <line x1="320" y1="80" x2="320" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4"/>
  <rect x="250" y="55" width="140" height="30" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
  <text x="320" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">React Client</text>

  <!-- Spring Boot API -->
  <line x1="520" y1="80" x2="520" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4"/>
  <rect x="450" y="55" width="140" height="30" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
  <text x="520" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">Spring Boot API</text>

  <!-- MySQL DB -->
  <line x1="720" y1="80" x2="720" y2="400" stroke="#64748b" stroke-width="1.5" stroke-dasharray="4"/>
  <rect x="650" y="55" width="140" height="30" fill="#f1f5f9" stroke="#475569" stroke-width="1.5" rx="4"/>
  <text x="720" y="74" text-anchor="middle" font-family="Inter, sans-serif" font-size="11" font-weight="bold" fill="#1e293b">MySQL DB</text>

  <!-- Activation bars -->
  <rect x="115" y="100" width="10" height="280" fill="#cbd5e1" stroke="#475569" stroke-width="1"/>
  <rect x="315" y="100" width="10" height="280" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <rect x="515" y="125" width="10" height="235" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>
  <rect x="715" y="150" width="10" height="60" fill="#eff6ff" stroke="#3b82f6" stroke-width="1"/>

  <!-- Messages -->
  <!-- 1. Nhập username/password -->
  <line x1="125" y1="110" x2="315" y2="110" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="104" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#1e3a8a">1. Nhập credentials &amp; Click Login</text>

  <!-- 2. POST /api/v1/auth/login -->
  <line x1="325" y1="135" x2="515" y2="135" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="129" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#1e3a8a">2. POST /api/v1/auth/login</text>

  <!-- 3. Query User -->
  <line x1="525" y1="160" x2="715" y2="160" stroke="#3b82f6" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="620" y="154" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#1e3a8a">3. Query User by Username</text>

  <!-- 4. Return user details -->
  <line x1="715" y1="195" x2="525" y2="195" stroke="#3b82f6" stroke-width="1.2" stroke-dasharray="3" marker-end="url(#arrow)"/>
  <text x="620" y="189" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#1e3a8a">4. Trả về thông tin User</text>

  <!-- 5. BCrypt Match -->
  <path d="M 525 220 L 555 220 L 555 245 L 530 245" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="560" y="235" font-family="Inter, sans-serif" font-size="10" fill="#1e293b">5. So khớp BCrypt Hash</text>

  <!-- 6. Return JWT -->
  <line x1="515" y1="280" x2="325" y2="280" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="420" y="274" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#065f46">6. 200 OK (Trả về JWT Token)</text>

  <!-- 7. Save token & redirect -->
  <path d="M 315 310 L 285 310 L 285 335 L 310 335" fill="none" stroke="#475569" stroke-width="1.2" marker-end="url(#arrow)"/>
  <text x="210" y="325" font-family="Inter, sans-serif" font-size="10" fill="#1e293b">7. Lưu Token vào Client</text>

  <!-- 8. Display Dashboard -->
  <line x1="315" y1="365" x2="125" y2="365" stroke="#10b981" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="220" y="359" text-anchor="middle" font-family="Inter, sans-serif" font-size="10" fill="#065f46">8. Hiển thị trang quản trị</text>

  <!-- Definition of marker elements -->
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#3b82f6"/>
    </marker>
  </defs>
</svg>
